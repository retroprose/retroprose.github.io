<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/ico" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width" />
		<meta name="generator" content="mycontent" />
		<title>Join Game</title>
		<style> /* no styles */ </style>
	</head>
	<body>
		<h1>Join Game</h1>
		<form id="user-form">
			<input id="domain" name="domain" type="text" value="localhost" />
			<input id="name" name="name" type="text" value="default name" />
		</form>
		<button onclick="join();">Join</button>
		<div><p id="error"></p></div>
		<script>
			// get domain from url
			const params = new URLSearchParams(window.location.search);  
			if (params.has('u')) {
				const domainInput = document.getElementById("domain");
				domainInput.value = params.get('u');
				domainInput.disabled = true;
			}

			// join game
			function join() {
				const err = document.getElementById("error");
				const errList = [];
				errList.push('<p>start of function</p>');
				err.innerHTML = errList.join('');
				try {
					errList.push('<p>start of block</p>');
					err.innerHTML = errList.join('');
					const domainInput = document.getElementById("domain");
					const nameInput = document.getElementById("name");
					const domain = domainInput.value;
					errList.push('<p>' + domain + '</p>');
					err.innerHTML = errList.join('');				
					var json = JSON.stringify({
						user: {
							name: nameInput.value
						}
					});
					errList.push('<p>start of fetch</p>');
					err.innerHTML = errList.join('');
					fetch(`http://${domain}/join`, {
						headers: {
							'Accept': 'application/json',
							'Content-Type': 'application/json'
						},
						method: 'POST',
						body: json
					})
					.then((response) => response.json())
					.then((json) => {										
						const url = `${json.url}?s=${json.slot}&k=${json.key}&u=${domain}`;
						errList.push('<p>' + url + '</p>');
						err.innerHTML = errList.join('');		
						window.location.replace(url);
					});
				} catch (e) {
					err.innerHTML = '<p>' + e.toString() + '</p>';
				}
			}
		</script>
	</body>
</html>
