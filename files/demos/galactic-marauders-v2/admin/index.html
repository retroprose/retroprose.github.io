<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/ico" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width" />
		<meta name="generator" content="mycontent" />
		<title>Galactic Marauders Admin</title>
		<style> /* no styles */ </style>
	</head>
	<body>
		<h1>Galactic Marauders Admin</h1>
		<div><p id="error"></p></div>
		<div id="connect">
			<h3>Connect</h3>
			<label for="domain">Domain: </label><input id="domain" type="text" value="localhost"/><label for="password">Password: </label><input id="password" type="text" value="password" /><button onclick="connect();">Connect</button>
		</div>
		<div id="configure" hidden>
			<h3>Configure</h3>
			<label for="settings">Settings: </label><textarea id="settings"></textarea><button onclick="configure();">Configure</button>
		</div>
		<div id="join" hidden>
			<h3>Join Session</h3>
			<label for="name">Name: </label><input id="name" type="text" /></body><button onclick="join();">Join</button>
		</div>
		<div id="roster" hidden>
			<table>
				<thead>
					<tr>
						<th scope="col">Player</th>
						<th scope="col">Connected</th>
						<th scope="col">Kick</th>
					</tr>
				</thead>
				<tbody id="roster-body">				
				</tbody>
			</table>
		</div>
		<script>

			// auto connect if url parameters were supplied
			const params = new URLSearchParams(window.location.search);  
			if (params.has('u')) {
				const domain = document.getElementById("domain");
				const password = document.getElementById("password");
				password.value = (params.has('p')) ? params.get('p') : '';
				domain.value = params.get('u');				
				connect();
			}
			
			window.rosterQuery = undefined;

			function default_values() {
				const guest = document.getElementById("name");
				const config = document.getElementById("settings");
				guest.value = 'Guest' + Math.floor(Math.random()*9999);
				configData = {
					url: "https://localhost:666/galactic-marauders-v2",
					slot: 32,
					input: 1,
					buffer: 32,
					user: {
						special: "data"
					}
				}
				config.value = JSON.stringify(configData, null, 4);				
			}
			default_values();
			
			function refreshRoster() {
				const domain = document.getElementById("domain");
				fetch(`https://${domain.value}/roster`, {
					headers: {
						'Accept': 'application/json'
					},
					method: 'GET'
				})
				.then((response) => response.json())
				.then((json) => {
					if (json.hasOwnProperty('code')) {
						console.log("Failed to get roster, configuration change in progress.")
					} else {
						const roster = document.getElementById("roster-body");
						let list = [];
						let index = 0;
						console.log(json);
						for (const entry of json) {
							if (entry.user == null) {
								list.push(`<tr><th scope="row">__UNOCCUPIED__</th><td>false</td><td><button disabled>Kick</button></td></tr>`);
							} else {
								list.push(`<tr><th scope="row">${entry.user.name}</th><td>${entry.connected}</td><td><button onclick="kick(${index});">Kick</button></td></tr>`);
							}
							++index;
						}
						roster.innerHTML = list.join('');
					}
				});
			}

			function kick(slot) {
				console.log('kick ' + slot)
				const domain = document.getElementById("domain");
				const password = document.getElementById("password");
				fetch(`https://${domain.value}/kick/${slot}`, {
					headers: {
						'Authorization': 'Basic ' + btoa('admin:' + password.value),
						'Accept': 'application/json',
						'Content-Type': 'application/json'
					},
					method: 'PUT',
					body: '{}'
				})
				.then((response) => response.json())
				.then((json) => {
					const error = document.getElementById("error");
					error.innerHTML = "<p>Player Kicked</p>";
				});
			}

			function connect() {
				const password = document.getElementById("password");
				const player = document.getElementById("join");
				const connect = document.getElementById("connect");
				for (el of connect.children) { 
					el.disabled = true;
				}
				if (password.value.trim() == '') {
					player.hidden = false;
					connect.hidden = true;
				} else {
					const domain = document.getElementById("domain");				
					const config = document.getElementById("configure");
					const settings = document.getElementById("settings");					
					fetch(`https://${domain.value}/data`, {
						headers: {
							'Accept': 'application/json',
						},
						method: 'GET'
					})
					.then((response) => response.json())
					.then((json) => {
						console.log(json);
						if (!json.hasOwnProperty('code')) {
							settings.value = JSON.stringify(json, null, 4);
							player.hidden = false;
							roster.hidden = false;
							refreshRoster();
							if (window.rosterQuery == undefined) {	
								window.rosterQuery = setInterval(refreshRoster, 3000);
							}
						}
						config.hidden = false;
					});
				}
			}

			function configure() {
				const domain = document.getElementById("domain");
				const password = document.getElementById("password");
				const settings = document.getElementById("settings");
				const player = document.getElementById("join");
				const roster = document.getElementById("roster");

				fetch(`https://${domain.value}/config`, {
					headers: {
						'Authorization': 'Basic ' + btoa('admin:' + password.value),
						'Accept': 'application/json',
						'Content-Type': 'application/json'
					},
					method: 'PUT',
					body: settings.value
				})
				.then((response) => response.json())
				.then((json) => {
					const error = document.getElementById("error");
					error.innerHTML = "<p>Configuration Updated</p>";
				});

				player.hidden = false;
				roster.hidden = false;
				refreshRoster();
				if (window.rosterQuery == undefined) {				
					window.rosterQuery = setInterval(refreshRoster, 3000);
				}
			}

			function join() {
				const guest = document.getElementById("name");
				const password = document.getElementById("password");
				const domain = document.getElementById("domain");
				const user = {
					name: guest.value
				};
				const userJson = JSON.stringify(user);
				if (password.value.trim() == '') {
					// this is the host launching the game
					fetch(`https://${domain.value}/join`, {
						headers: {
							//'Authorization': 'Basic ' + btoa('guest:join'),
							'Accept': 'application/json',
							'Content-Type': 'application/json'
						},
						method: 'PUT',
						body: userJson
					})
					.then((response) => response.json())
					.then((json) => {
						console.log(json);
						if (json.code < 1) {
							const error = document.getElementById("error");
							error.innerHTML = "<p>Host hasn't configured game yet...</p>";
						} else {
							const url = `${json.url}?s=${json.slot}&k=${json.key}&u=${domain.value}`;
							console.log(url);
							window.location.replace(url);
						}
					});
				} else {
					// this is the host launching the game
					fetch(`https://${domain.value}/host`, {
						headers: {
							'Authorization': 'Basic ' + btoa('admin:' + password.value),
							'Accept': 'application/json',
							'Content-Type': 'application/json'
						},
						method: 'PUT',
						body: userJson
					})
					.then((response) => response.json())
					.then((json) => {
						console.log(json);
						const url = `${json.url}?s=${json.slot}&k=${json.key}&u=${domain.value}`;
						console.log(url);
						window.location.replace(url);
					});
				}
			}
		</script>
	</body>
</html>
