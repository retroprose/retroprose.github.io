		<title>Test Touch screen</title>
		<style>
			html, body {
				margin: 0 !important;
            	padding: 0 !important;
	        	overflow-x: hidden;
				
				touch-action: none;
				-webkit-touch-callout: none; /* iOS Safari */
					-webkit-user-select: none; /* Safari */
					-khtml-user-select: none; /* Konqueror HTML */
					-moz-user-select: none; /* Old versions of Firefox */
						-ms-user-select: none; /* Internet Explorer/Edge */
							user-select: none; /* Non-prefixed version, currently
												supported by Chrome, Edge, Opera and Firefox */

    		}
			canvas {
				width: 100%;
				height: 100%;
				object-fit: contain;
				background-color: #000000;
				/* overflow: hidden; */

				touch-action: none;
				-webkit-touch-callout: none; /* iOS Safari */
					-webkit-user-select: none; /* Safari */
					-khtml-user-select: none; /* Konqueror HTML */
					-moz-user-select: none; /* Old versions of Firefox */
						-ms-user-select: none; /* Internet Explorer/Edge */
							user-select: none; /* Non-prefixed version, currently
												supported by Chrome, Edge, Opera and Firefox */

			}
		</style>
	</head>
	<body>
		<script src="../scripts/core/pixi.min.js"></script>
		<script src="../scripts/core/cpp-module.js"></script>
		<script src="../scripts/core/screen.js"></script>
		<script src="../scripts/core/basicinput.js"></script>
		<script src="../scripts/core/inputstick.js"></script>
		<script src="../scripts/states/select.js"></script>
		<script src="../scripts/states/offline.js"></script>
		<script src="../scripts/states/connected.js"></script>
		<script src="../scripts/synced-states/lobby.js"></script>
		<script src="../scripts/synced-states/bomber.js"></script>
		<script src="../scripts/app.js"></script>
		<script>
			(async () => {
				// await this so that we know the module is already loaded!
				await (() => {
					return new Promise(resolve => {
						Module.onRuntimeInitialized = function() {
							resolve();
						};
					});    
				})();
				// initialize the app
				await new App().init();
			})();
		</script>
	</body>
